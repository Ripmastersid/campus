<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sidrak Campus - Three.js</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #1a1a1a; font-family: sans-serif; touch-action: none; user-select: none; }
        canvas { display: block; width: 100vw; height: 100vh; }
        
        /* UI Overlay */
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        
        /* Joystick Esquerdo */
        #joystick-zone {
            position: absolute; bottom: 20px; left: 20px; width: 120px; height: 120px;
            background: rgba(255, 255, 255, 0.1); border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%; pointer-events: auto; touch-action: none;
        }
        #joystick-knob {
            position: absolute; top: 50%; left: 50%; width: 50px; height: 50px;
            background: rgba(255, 102, 0, 0.8); border-radius: 50%;
            transform: translate(-50%, -50%);
        }

        /* Botão Atirar */
        #btn-shoot {
            position: absolute; bottom: 40px; right: 40px; width: 80px; height: 80px;
            background: rgba(255, 50, 50, 0.8); border: 3px solid white; border-radius: 50%;
            color: white; font-weight: bold; font-size: 14px;
            display: flex; align-items: center; justify-content: center;
            pointer-events: auto; touch-action: none;
        }

        /* HUD Info */
        #hud {
            position: absolute; top: 10px; left: 10px; color: white;
            background: rgba(0,0,0,0.5); padding: 5px 10px; border-radius: 5px;
            font-size: 14px; pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="ui-layer">
        <div id="hud">Carregando Sidrak...</div>
        <div id="joystick-zone"><div id="joystick-knob"></div></div>
        <div id="btn-shoot">ATIRAR</div>
    </div>

    <!-- Import Map para Three.js -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        // 1. Configuração Básica da Cena
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB); // Céu azul claro
        scene.fog = new THREE.Fog(0x87CEEB, 20, 100); // Neblina para profundidade

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        // 2. Iluminação
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        
        const dirLight = new THREE.DirectionalLight(0xffffff, 1);
        dirLight.position.set(10, 20, 10);
        dirLight.castShadow = true;
        scene.add(dirLight);

        // 3. Chão (Grid simples para referência de movimento)
        const groundGeometry = new THREE.PlaneGeometry(100, 100);
        const groundMaterial = new THREE.MeshStandardMaterial({ color: 0x555555 });
        const ground = new THREE.Mesh(groundGeometry, groundMaterial);
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);

        const gridHelper = new THREE.GridHelper(100, 50);
        scene.add(gridHelper);

        // 4. Carregar o Sidrak (GLB)
        let player = null;
        const loader = new GLTFLoader();
        const modelUrl = 'https://cdn.jsdelivr.net/gh/Ripmastersid/campus@main/Sidrak-v2.glb';

        loader.load(modelUrl, (gltf) => {
            player = gltf.scene;
            
            // Ajustar escala e posição (Centralizar na base dos pés)
            const box = new THREE.Box3().setFromObject(player);
            const center = box.getCenter(new THREE.Vector3());
            player.position.x = -center.x;
            player.position.z = -center.z;
            player.position.y = -box.min.y; // Coloca os pés no chão (y=0)

            player.traverse((child) => {
                if (child.isMesh) {
                    child.castShadow = true;
                    child.receiveShadow = true;
                }
            });

            scene.add(player);
            document.getElementById('hud').innerText = '✅ Sidrak Pronto! Use o joystick.';
            
            // Posicionar câmera inicial
            camera.position.set(0, 3, 5);
            camera.lookAt(player.position);
        }, undefined, (error) => {
            console.error(error);
            document.getElementById('hud').innerText = ' Erro ao carregar modelo.';
        });

        // 5. Lógica de Movimento e Câmera
        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
        const speed = 0.1;
        let cameraAngle = 0; // Ângulo da câmera ao redor do player

        // Joystick Logic
        const joystickZone = document.getElementById('joystick-zone');
        const joystickKnob = document.getElementById('joystick-knob');
        let joystickActive = false;
        let joyStartX = 0, joyStartY = 0;

        joystickZone.addEventListener('touchstart', (e) => {
            joystickActive = true;
            const touch = e.touches[0];
            const rect = joystickZone.getBoundingClientRect();
            joyStartX = rect.left + rect.width / 2;
            joyStartY = rect.top + rect.height / 2;
        });

        joystickZone.addEventListener('touchmove', (e) => {
            if (!joystickActive) return;
            e.preventDefault();
            const touch = e.touches[0];
            let dx = touch.clientX - joyStartX;
            let dy = touch.clientY - joyStartY;
            
            // Limitar o knob
            const maxDist = 35;
            const dist = Math.sqrt(dx*dx + dy*dy);
            if (dist > maxDist) {
                dx = (dx / dist) * maxDist;
                dy = (dy / dist) * maxDist;
            }
            joystickKnob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;

            // Definir direção
            moveForward = dy < -10;
            moveBackward = dy > 10;
            moveLeft = dx < -10;
            moveRight = dx > 10;
        });

        joystickZone.addEventListener('touchend', () => {
            joystickActive = false;
            joystickKnob.style.transform = `translate(-50%, -50%)`;
            moveForward = moveBackward = moveLeft = moveRight = false;
        });

        // Controle de Câmera (Arrastar na tela, exceto no joystick/botão)
        let isDragging = false;
        let lastTouchX = 0;

        document.addEventListener('touchstart', (e) => {
            if (e.target.id !== 'joystick-zone' && e.target.id !== 'joystick-knob' && e.target.id !== 'btn-shoot') {
                isDragging = true;
                lastTouchX = e.touches[0].clientX;
            }
        });

        document.addEventListener('touchmove', (e) => {
            if (isDragging) {
                const touch = e.touches[0];
                const deltaX = touch.clientX - lastTouchX;
                cameraAngle -= deltaX * 0.005; // Sensibilidade
                lastTouchX = touch.clientX;
            }
        });

        document.addEventListener('touchend', () => { isDragging = false; });

        // Botão Atirar (Apenas visual por enquanto)
        document.getElementById('btn-shoot').addEventListener('touchstart', (e) => {
            e.preventDefault();
            document.getElementById('hud').innerText = '💥 POW!';
            setTimeout(() => document.getElementById('hud').innerText = '✅ Sidrak Pronto!', 500);
        });

        // 6. Loop de Animação
        function animate() {
            requestAnimationFrame(animate);

            if (player) {
                // Calcular direção baseada no ângulo da câmera
                const direction = new THREE.Vector3();
                if (moveForward) direction.z -= 1;
                if (moveBackward) direction.z += 1;
                if (moveLeft) direction.x -= 1;
                if (moveRight) direction.x += 1;

                if (direction.length() > 0) {
                    direction.normalize();
                    
                    // Rotacionar o vetor de movimento pelo ângulo da câmera
                    direction.applyAxisAngle(new THREE.Vector3(0, 1, 0), cameraAngle);
                    
                    player.position.add(direction.multiplyScalar(speed));
                    
                    // Rotacionar o modelo para olhar na direção do movimento
                    const targetRotation = Math.atan2(direction.x, direction.z);
                    player.rotation.y = targetRotation;
                }

                // Câmera segue o player (TPS)
                const cameraOffset = new THREE.Vector3(0, 3, 5); // 3m acima, 5m atrás
                cameraOffset.applyAxisAngle(new THREE.Vector3(0, 1, 0), cameraAngle);
                
                camera.position.copy(player.position).add(cameraOffset);
                camera.lookAt(player.position.x, player.position.y + 1, player.position.z);
            }

            renderer.render(scene, camera);
        }

        animate();

        // Ajuste de tela
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
